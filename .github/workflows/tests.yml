name: InvoiceFlow Python tests and offline demo
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify built wheel contains dashboard
        run: |
          python -m pip wheel --no-deps . -w wheelhouse
          python -c "from pathlib import Path; from zipfile import ZipFile; p=next(Path('wheelhouse').glob('*.whl')); assert 'invoiceflow/static/index.html' in ZipFile(p).namelist()"
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run offline evaluation
        run: python scripts/demo.py
